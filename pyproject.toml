[project]
name = "grip"
version = "2.0.0"
description = "GRIP Grounding Engine — decides whether public evidence supports each claim, with exact quotes. No generative model decides any verdict."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "pydantic==2.9.2",
  "httpx==0.27.2",
  "uvicorn==0.30.6",
]

[project.optional-dependencies]
test = ["pytest==8.3.3", "pytest-asyncio==0.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
